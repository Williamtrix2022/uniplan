name: uniplan
description: Aplicación móvil para organización académica universitaria
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
   

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  table_calendar: ^3.0.9
  fl_chart: ^0.68.0
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Auth
  google_sign_in: ^6.2.1

  # Utils
  intl: ^0.19.0

  # Navigation
  app_links: ^6.3.3

  # Notifications (on-device scheduling, no push/FCM)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/uniplan_logo.png"
  min_sdk_android: 21
