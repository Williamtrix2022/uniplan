name: Release Please

# Mantiene una "Release PR" viva contra main: cada commit que se mergea a main
# se acumula en esa PR con su bump de versión y su entrada de changelog, según
# Conventional Commits (feat -> minor, fix -> patch, ! o BREAKING CHANGE -> major).
#
# Al mergear la Release PR, release-please escribe CHANGELOG.md, bumpea las
# versiones en mobile/pubspec.yaml y backend/package.json, crea los tags y
# publica las GitHub Releases. Recién ahí se construye y distribuye el APK.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Mantener Release PR
    runs-on: ubuntu-latest
    outputs:
      mobile_released: ${{ steps.release.outputs['mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['mobile--tag_name'] }}
      mobile_version: ${{ steps.release.outputs['mobile--version'] }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Con el GITHUB_TOKEN por defecto esto falla con "GitHub Actions is
          # not permitted to create or approve pull requests", y aunque se
          # habilite esa opción del repo, las PRs que abre ese token NO
          # disparan workflows — así que la Release PR quedaría sin checks y
          # la protección de main nunca la dejaría mergear.
          #
          # Un PAT actúa como usuario: puede abrir la PR y además dispara
          # ci-tests.yml sobre ella. El fallback a github.token deja el
          # workflow funcional mientras el secret no exista todavía.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  distribute-android:
    name: Construir y distribuir APK
    needs: release-please
    # Solo corre cuando release-please efectivamente publicó una release de la
    # app móvil, no en cada push a main.
    if: needs.release-please.outputs.mobile_released == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64."
            echo "::error::Sin él el APK se firmaría con la keystore de debug efímera del runner, cuya SHA-1 cambia en cada corrida y no está registrada en Firebase. El login con Google fallaría con DEVELOPER_ERROR (10)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          cat > mobile/android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          PROPS

      - name: Build APK
        working-directory: mobile
        # build-name sale de la versión semántica que acaba de publicar
        # release-please. build-number tiene que ser monótono para que Play
        # Store e instaladores acepten la actualización, y github.run_number
        # cumple esa garantía.
        run: |
          flutter build apk --release \
            --build-name=${{ needs.release-please.outputs.mobile_version }} \
            --build-number=${{ github.run_number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: public-uniplan
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Uniplan ${{ needs.release-please.outputs.mobile_tag }}"

      - name: Adjuntar APK a la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.mobile_tag }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
