name: Deploy to Firebase App Distribution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=${{ github.run_number }}
          echo "name=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$BASE_VERSION+$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        working-directory: mobile

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: public-uniplan
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Build automático desde main (${{ steps.version.outputs.tag }})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }})"
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
