name: Distribución manual a Firebase

# Escape hatch: construye y sube un APK a Firebase App Distribution a pedido,
# sin crear tags ni GitHub Releases.
#
# Las releases versionadas las gobierna release-please.yml, que se dispara solo
# al mergear la Release PR. Este workflow existe para builds de prueba fuera de
# ese ciclo (por ejemplo, validar una rama antes de mergear).
#
# Antes se ejecutaba en cada push a main y creaba una GitHub Release con tag
# v<version>+<run_number>. Como la versión de pubspec.yaml nunca se bumpeaba,
# todas las releases salían como v1.0.0 y solo cambiaba el contador de builds.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o commit a construir"
        required: false
        default: main
      notes:
        description: "Notas para los testers"
        required: false
        default: "Build manual de prueba"

permissions:
  contents: read

jobs:
  build-and-distribute:
    name: Construir y distribuir APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Resolve version
        id: version
        working-directory: mobile
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "name=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: public-uniplan
          file: mobile/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ inputs.notes }}
